<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>NLPCC 2026 Task 10 - Phase 1 Leaderboard (Preliminary Ver.)</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f7f5;
      --surface: #ffffff;
      --surface-muted: #f1f1ee;
      --border: #deded8;
      --border-strong: #c9c9c2;
      --text: #0d0d0d;
      --muted: #6f6f69;
      --accent: #10a37f;
      --accent-strong: #0d8f70;
      --accent-soft: #e8f7f2;
      --focus: #10a37f;
      --gold: #9a6b00;
      --gold-bg: #fff5cf;
      --silver: #59636e;
      --silver-bg: #edf0f3;
      --bronze: #8a4b20;
      --bronze-bg: #f8e8dc;
      --radius: 8px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.45;
    }

    button,
    input {
      font: inherit;
      letter-spacing: 0;
    }

    button:focus-visible,
    input:focus-visible,
    a:focus-visible {
      outline: 3px solid rgba(16, 163, 127, 0.24);
      outline-offset: 2px;
    }

    .page-shell {
      width: min(1220px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .identity {
      min-width: 0;
    }

    .phase {
      margin: 0 0 5px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 750;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 25px;
      line-height: 1.2;
      font-weight: 650;
      letter-spacing: 0;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 0 14px;
    }

    .tabs {
      display: inline-flex;
      gap: 2px;
      padding: 3px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface-muted);
    }

    .tab {
      min-width: 96px;
      border: 0;
      border-radius: 4px;
      padding: 8px 13px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-weight: 700;
    }

    .tab:hover {
      color: var(--text);
    }

    .tab[aria-selected="true"] {
      background: var(--text);
      color: var(--surface);
      box-shadow: 0 1px 2px rgba(13, 13, 13, 0.16);
    }

    .search-wrap {
      position: relative;
      width: min(290px, 100%);
    }

    .search-wrap::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 12px;
      width: 10px;
      height: 10px;
      border: 2px solid var(--muted);
      border-radius: 50%;
      transform: translateY(-62%);
      pointer-events: none;
    }

    .search-wrap::after {
      content: "";
      position: absolute;
      top: calc(50% + 5px);
      left: 22px;
      width: 6px;
      height: 2px;
      background: var(--muted);
      transform: rotate(45deg);
      transform-origin: left center;
      pointer-events: none;
    }

    #team-search {
      width: 100%;
      height: 38px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      padding: 7px 12px 7px 35px;
      background: var(--surface);
      color: var(--text);
    }

    #team-search::placeholder {
      color: #89939d;
    }

    .status {
      min-height: 44px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      background: var(--surface);
      color: var(--muted);
    }

    .status.error {
      border-color: #d99ba3;
      background: var(--accent-soft);
      color: #7e1d2a;
    }

    .table-panel {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .table-scroll {
      overflow-x: auto;
      overscroll-behavior-x: contain;
    }

    table {
      width: 100%;
      min-width: 760px;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th,
    td {
      border-bottom: 1px solid var(--border);
      padding: 11px 13px;
      text-align: left;
      vertical-align: middle;
    }

    th {
      height: 44px;
      background: var(--surface-muted);
      color: #4f5b66;
      font-size: 11px;
      font-weight: 760;
      text-transform: uppercase;
      white-space: nowrap;
    }

    th:first-child,
    td:first-child {
      width: 76px;
      text-align: center;
    }

    th:last-child,
    td:last-child {
      width: 58px;
      text-align: center;
    }

    tbody tr.data-row {
      cursor: pointer;
    }

    tbody tr.data-row:hover {
      background: #fafaf8;
    }

    tbody tr.data-row[aria-expanded="true"] {
      background: #f8f9fa;
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    .sort-button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      border: 0;
      padding: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
      font: inherit;
      font-weight: inherit;
      text-align: left;
      text-transform: inherit;
    }

    .numeric .sort-button {
      justify-content: flex-end;
      text-align: right;
    }

    .sort-mark {
      width: 12px;
      color: #8a949e;
      text-align: center;
    }

    .numeric {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .team {
      overflow-wrap: anywhere;
      font-weight: 720;
    }

    .rank-badge {
      display: inline-grid;
      place-items: center;
      min-width: 30px;
      height: 26px;
      border-radius: 4px;
      background: var(--surface-muted);
      color: var(--muted);
      font-weight: 760;
      font-variant-numeric: tabular-nums;
    }

    .rank-1 .rank-badge {
      background: var(--gold-bg);
      color: var(--gold);
    }

    .rank-2 .rank-badge {
      background: var(--silver-bg);
      color: var(--silver);
    }

    .rank-3 .rank-badge {
      background: var(--bronze-bg);
      color: var(--bronze);
    }

    .expand-button {
      display: inline-grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border: 1px solid transparent;
      border-radius: 4px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
    }

    .expand-button:hover {
      border-color: var(--border);
      background: var(--surface-muted);
      color: var(--text);
    }

    .data-row[aria-expanded="true"] .expand-button {
      color: var(--accent);
      transform: rotate(90deg);
    }

    .detail-row td {
      width: auto !important;
      padding: 0;
      background: #f8f9fa;
      text-align: left !important;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1px;
      padding: 1px;
      background: var(--border);
    }

    .detail-item {
      min-width: 0;
      padding: 12px 14px;
      background: var(--surface);
    }

    .detail-item.wide {
      grid-column: span 2;
    }

    .detail-label {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 750;
      text-transform: uppercase;
    }

    .detail-value {
      display: block;
      overflow-wrap: anywhere;
      font-variant-numeric: tabular-nums;
      font-weight: 650;
    }

    .result-note {
      padding: 11px 13px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
    }

    .empty-row td {
      padding: 34px 16px;
      color: var(--muted);
      text-align: center;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 760px) {
      .page-shell {
        width: min(100% - 20px, 1220px);
        padding-top: 18px;
      }

      .masthead {
        align-items: stretch;
        flex-direction: column;
        gap: 16px;
      }

      h1 {
        font-size: 21px;
      }

      .toolbar {
        align-items: stretch;
        flex-direction: column;
        gap: 10px;
      }

      .tabs {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
      }

      .tab {
        min-width: 0;
        padding-inline: 8px;
      }

      .search-wrap {
        width: 100%;
      }

      .detail-grid {
        grid-template-columns: 1fr;
      }

      .detail-item.wide {
        grid-column: auto;
      }
    }

    @media (max-width: 430px) {
      .detail-grid {
        grid-template-columns: 1fr;
      }

      .detail-item.wide {
        grid-column: auto;
      }
    }
  </style>
</head>

    function formatScore(value) {

    function appendText(parent, tag, text, className) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      node.textContent = String(text);
      parent.appendChild(node);
      return node;
    }

    function makeHeader(config) {
      headNode.replaceChildren();
      const row = document.createElement("tr");
      for (const column of config.columns) {
        const cell = document.createElement("th");
        if (column.numeric) cell.classList.add("numeric");
        const button = document.createElement("button");
        button.type = "button";
        button.className = "sort-button";
        button.dataset.sortKey = column.key;
        button.setAttribute("aria-label", `Sort by ${column.label}`);
        appendText(button, "span", column.label);
        const mark = appendText(button, "span", "", "sort-mark");
        mark.setAttribute("aria-hidden", "true");
        if (state.sortKey === column.key) {
          mark.textContent = state.sortDirection === "asc" ? "^" : "v";
          button.setAttribute(
            "aria-label",
            `Sort by ${column.label}, currently ${state.sortDirection}`
          );
        }
        cell.appendChild(button);
        row.appendChild(cell);
      }
      const expandHeader = document.createElement("th");
      expandHeader.textContent = "Details";
      row.appendChild(expandHeader);
      headNode.appendChild(row);
    }

    function detailEntries(row, config) {
      const entries = config.details.map(([label, key, score, wide]) => ({
        label,
        value: score ? formatScore(row[key]) : row[key],
        wide: Boolean(wide)

          label: "Best-score source",
          value: row.track1_submission_pk === row.track2_submission_pk
            ? "Same submission"
            : "Different submissions",
          wide: true
        });
      }
      return entries;
    }

    function renderDetailRow(row, config, columnCount) {
      const detailRow = document.createElement("tr");
      detailRow.className = "detail-row";
      const cell = document.createElement("td");
      cell.colSpan = columnCount + 1;
      const grid = document.createElement("div");
      grid.className = "detail-grid";
      for (const entry of detailEntries(row, config)) {

        item.className = entry.wide ? "detail-item wide" : "detail-item";
        appendText(item, "span", entry.label, "detail-label");
        appendText(item, "span", entry.value, "detail-value");
        grid.appendChild(item);

      return detailRow;
    }

    function compareRows(left, right) {
      const key = state.sortKey;
      const leftValue = left[key];
      const rightValue = right[key];
      let comparison;
      if (typeof leftValue === "number" && typeof rightValue === "number") {
        comparison = leftValue - rightValue;
      } else {
        comparison = String(leftValue).localeCompare(String(rightValue));
      }
      if (comparison === 0) {
        comparison = Number(left.rank) - Number(right.rank);
      }
      return state.sortDirection === "asc" ? comparison : -comparison;
    }

    function visibleRows() {
      const rows = state.payload.rankings[state.track] || [];
      const query = state.query.trim().toLocaleLowerCase();
      return rows
        .filter((row) => !query || String(row.username).toLocaleLowerCase().includes(query))
        .slice()
        .sort(compareRows);
    }

    function renderRows(config) {
      bodyNode.replaceChildren();
      const rows = visibleRows();
      if (!rows.length) {
        const emptyRow = document.createElement("tr");
        emptyRow.className = "empty-row";
        const cell = document.createElement("td");
        cell.colSpan = config.columns.length + 1;
        cell.textContent = state.query ? "No matching teams." : "No ranking data.";
        emptyRow.appendChild(cell);
        bodyNode.appendChild(emptyRow);
      }

      for (const row of rows) {
        const rowKey = `${state.track}:${row.username}`;
        const expanded = state.expandedKey === rowKey;
        const dataRow = document.createElement("tr");
        dataRow.className = `data-row rank-${row.rank}`;
        dataRow.dataset.rowKey = rowKey;
        dataRow.tabIndex = 0;
        dataRow.setAttribute("aria-expanded", String(expanded));

        for (const column of config.columns) {
          const cell = document.createElement("td");
          if (column.numeric) cell.classList.add("numeric");
          if (column.key === "rank") {
            appendText(cell, "span", row.rank, "rank-badge");
          } else {
            const value = column.score ? formatScore(row[column.key]) : row[column.key];
            appendText(
              cell,
              "span",
              value,
              column.key === "username" ? "team" : ""
            );
          }
          dataRow.appendChild(cell);
        }

        const actionCell = document.createElement("td");
        const expandButton = appendText(actionCell, "button", "›", "expand-button");
        expandButton.type = "button";
        expandButton.title = expanded ? "Hide details" : "Show details";
        expandButton.setAttribute(
          "aria-label",
          `${expanded ? "Hide" : "Show"} details for ${row.username}`
        );
        dataRow.appendChild(actionCell);
        bodyNode.appendChild(dataRow);
        if (expanded) {
          bodyNode.appendChild(renderDetailRow(row, config, config.columns.length));
        }
      }

      resultNoteNode.textContent =
        `${rows.length} of ${state.payload.rankings[state.track].length} teams`;
    }

    function render() {
      if (!state.payload) return;
      const config = configs[state.track];
      makeHeader(config);
      renderRows(config);
    }

    function selectTrack(track) {
      state.track = track;
      state.sortKey = configs[track].scoreKey;
      state.sortDirection = "desc";
      state.expandedKey = null;
      document.querySelectorAll(".tab").forEach((tab) => {
        tab.setAttribute("aria-selected", String(tab.dataset.track === track));
      });
      render();
    }

    function toggleDetails(rowKey) {
      state.expandedKey = state.expandedKey === rowKey ? null : rowKey;
      render();
    }

    document.querySelector(".tabs").addEventListener("click", (event) => {
      const tab = event.target.closest("[data-track]");
      if (tab) selectTrack(tab.dataset.track);
    });

    searchNode.addEventListener("input", () => {
      state.query = searchNode.value;
      state.expandedKey = null;
      render();
    });

    headNode.addEventListener("click", (event) => {
      const button = event.target.closest("[data-sort-key]");
      if (!button) return;
      const key = button.dataset.sortKey;
      if (state.sortKey === key) {
        state.sortDirection = state.sortDirection === "asc" ? "desc" : "asc";
      } else {
        state.sortKey = key;
        state.sortDirection = key === "username" ? "asc" : "desc";
      }
      render();
    });

    bodyNode.addEventListener("click", (event) => {
      const row = event.target.closest(".data-row");
      if (row) toggleDetails(row.dataset.rowKey);
    });

    bodyNode.addEventListener("keydown", (event) => {
      const row = event.target.closest(".data-row");
      if (row && (event.key === "Enter" || event.key === " ")) {
        event.preventDefault();
        toggleDetails(row.dataset.rowKey);
      }
    });

    const dataPromise = Promise.resolve(inlinePayload);

    dataPromise
      .then((payload) => {
        if (!payload || !payload.summary || !payload.rankings) {
          throw new Error("Unexpected data format");
        }
        for (const track of Object.keys(configs)) {
          if (!Array.isArray(payload.rankings[track])) {
            throw new Error(`Missing ${track} ranking`);
          }
        }
        state.payload = payload;
        document.querySelector("#competition-title").textContent = payload.competition;
        document.querySelector("#phase-label").textContent = payload.phase;
        statusNode.hidden = true;
        panelNode.hidden = false;
        render();
      })
      .catch((error) => {
        statusNode.classList.add("error");
        statusNode.textContent =
          `Could not load leaderboard data (${error.message}). Serve this directory over HTTP.`;
      });
  </script>
</body>
</html>
